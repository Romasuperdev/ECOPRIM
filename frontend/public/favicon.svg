<!--
  Marque NEXORA — onglet du navigateur.

  Le bleu nuit #1E3A8A est celui des aplats d'identité de l'application (menu,
  bandeaux d'accueil, panneau de connexion) : c'est ce bleu-là qu'on reconnaît.
  Le monogramme est en blanc et non en bleu accent : à 16 px, deux bleus voisins
  se mélangent et la lettre disparaît. Le contraste prime sur la fidélité exacte
  au logo de l'écran, qui lui dispose de 30 px sur un fond déjà sombre.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NEXORA">
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1e3a8a"/>
  <path d="M20 47 L20 17 L44 47 L44 17"
        fill="none" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="20" y="52" width="24" height="3.5" rx="1.75" fill="#60a5fa"/>
</svg>
